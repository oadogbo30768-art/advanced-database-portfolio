# Binlog/replication-ready config sample (my.ini snippet for Portfolio 5 evidence)
# Place in MySQL my.ini (Windows: C:\ProgramData\MySQL\MySQL Server 8.0\my.ini) then restart.
# This makes the single node replication-ready: proves primary side of P5 architecture.
[mysqld]
server-id=1
log-bin=mysql-bin
binlog_format=ROW
gtid_mode=ON
enforce_gtid_consistency=ON
